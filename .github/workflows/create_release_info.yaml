name: Generate Latest Links

on:
  release:
    types: [published]
  workflow_dispatch:   # allows manual trigger

jobs:
  generate-links:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Get release info
        id: release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
            });
            return release.data;

      - name: Generate latest.txt
        run: |
          echo "Latest Release Links:" > latest.txt
          echo "" >> latest.txt
          for asset in $(jq -r '.assets[].browser_download_url' <<< '${{ steps.release.outputs.result }}'); do
            echo "$asset" >> latest.txt
          done

      - name: Upload latest.txt
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          tag_name: ${{ github.event.release.tag_name }}
          files: latest.txt
