name: Generate Latest Links

on:
  release:
    types: [published]
  workflow_dispatch:   # allows manual trigger

permissions:
  contents: write   # ✅ allow creating/updating releases

jobs:
  generate-links:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch release info
        id: release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let release;
            if (context.eventName === "release") {
              release = context.payload.release;
            } else {
              const latest = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              release = latest.data;
            }
            core.setOutput("id", release.id);
            core.setOutput("tag", release.tag_name);
            core.setOutput("data", JSON.stringify(release));

      - name: Generate latest-release.txt
        run: |
          echo "Latest Release Links:" > latest-release.txt
          echo "" >> latest-release.txt
          echo '${{ steps.release.outputs.data }}' | jq -r '.assets[].browser_download_url' >> latest-release.txt

      - name: Upload latest-release.txt
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          tag_name: ${{ steps.release.outputs.tag }}   # ✅ correct tag name
          files: latest-release.txt
